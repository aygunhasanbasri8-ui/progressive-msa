[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "progressive-msa"
version = "0.2.0"
description = "A pure-Python progressive multiple sequence alignment library (Clustal Omega-style: Needleman-Wunsch + UPGMA)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Basri" },
]
keywords = ["bioinformatics", "sequence-alignment", "msa", "needleman-wunsch", "upgma"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/aygunhasanbasri8-ui/basriMSA"

[tool.setuptools.packages.find]
include = ["progressive_msa*"]
