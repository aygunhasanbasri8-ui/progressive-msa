[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "progressive-msa"
version = "0.3.0"
description = "A pure-Python progressive multiple sequence alignment library (Clustal Omega-style: Needleman-Wunsch + UPGMA)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Basri Aygün" },
]
keywords = ["bioinformatics", "sequence-alignment", "msa", "needleman-wunsch", "upgma"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
msa = "progressive_msa.cli:main"

[project.urls]
Homepage = "https://github.com/aygunhasanbasri8-ui/progressive-msa"
Issues = "https://github.com/aygunhasanbasri8-ui/progressive-msa/issues"

[tool.setuptools.packages.find]
include = ["progressive_msa*"]

[tool.setuptools.package-data]
progressive_msa = ["py.typed"]

[tool.ruff]
target-version = "py39"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
